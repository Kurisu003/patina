[package]
name = "pinta-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
arboard = "3"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.37"
image = "0.25"
quick-xml = "0.42"
rayon = "1.12"
rfd = "0.18"
tiny-skia = "0.12"
zip = "9"
bytemuck = { version = "1", features = ["derive"] }
resvg = "0.50"
log = "0.4"
env_logger = "0.11"
egui = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
