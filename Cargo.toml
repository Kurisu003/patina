[package]
name = "patina"
version = "0.1.3"
edition = "2024"
description = "A fast, GPU-rendered image editor in Rust, ported from Pinta"
license-file = "LICENSE"
repository = "https://github.com/Kurisu003/patina"
build = "build.rs"

[dependencies]
ab_glyph = "0.2"
arboard = { version = "3", features = ["wayland-data-control"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.37"
image = "0.25"
quick-xml = "0.42"
rayon = "1.12"
rfd = "0.18"
tiny-skia = "0.12"
zip = "9"
bytemuck = { version = "1", features = ["derive"] }
resvg = "0.50"
log = "0.4"
env_logger = "0.11"
egui = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
