name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    # oldest supported Ubuntu runner, so the binary runs on older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Package
        run: |
          mkdir -p dist/patina
          cp target/release/patina README.md LICENSE LICENSE-PINTA-MIT.txt LICENSE-PDN.txt dist/patina/
          cp assets/icons/CREDITS.md dist/patina/ICON-CREDITS.md
          cp packaging/patina.desktop dist/patina/
          tar -C dist -czf patina-linux-x86_64.tar.gz patina
      - uses: actions/upload-artifact@v4
        with:
          name: patina-linux-x86_64
          path: patina-linux-x86_64.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: patina-linux-x86_64.tar.gz
          generate_release_notes: true
